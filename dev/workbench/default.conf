server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /shortcut-metadata {
        client_max_body_size 8k;
        proxy_pass http://shortcut-metadata:4175;
        proxy_read_timeout 10s;
    }

    location ^~ /shortcut-metadata/icons/ {
        proxy_pass http://shortcut-metadata:4175;
    }

    location ~ \.ttl$ {
        default_type text/turtle;
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
