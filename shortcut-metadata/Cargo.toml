[package]
name = "solid-workbench-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif"] }
ipnet = "2"
moka = { version = "0.12", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
